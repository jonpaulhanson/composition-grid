    <title>Composition Armatures — Free Composition Grid Overlay Tool</title>
    <!-- Resolve the theme before first paint. Without this the page renders dark, then
         corrects itself once React mounts, which a light-mode visitor sees as a flash. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark';
          document.documentElement.dataset.theme = theme;
        } catch (e) {
          /* Storage blocked — dark is the default anyway. */
        }
      })();
    </script>
